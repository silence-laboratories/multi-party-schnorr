[package]
name = "sl-mpc-vrf"
version = "0.1.0-pre.6"
edition = "2021"
license-file = "../../LICENSE"
description = "Threshold MPC VRF wire protocols on Ristretto (DKG + eval)"
repository = "https://github.com/silence-laboratories/multi-party-schnorr"
readme = "README.md"
rust-version = "1.88"

[features]
default = []
serde = ["dep:serde", "serde/alloc", "dep:serde_bytes", "curve25519-dalek/serde", "sl-mpc-mate/serde"]

[dependencies]
sl-mpc-derive = { path = "../sl-mpc-derive", version = "0.1.1", default-features = false, features = ["vrf"] }
sl-mpc-mate = { version = "1.1.0", default-features = false }
curve25519-dalek = { version = "~4.1.3", default-features = false, features = ["alloc", "digest", "group"] }
elliptic-curve = { version = "0.13" }
crypto-bigint = { version = "0.5", default-features = false }
ff = { version = "0.13.0", default-features = false }
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
sha2 = { version = "0.10.7", default-features = false }
sl-transcript = { version = "0.1.0-pre.2", default-features = false }
thiserror = { version = "2", default-features = false }
zeroize = { version = "1.6.1", default-features = false, features = ["zeroize_derive", "alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
