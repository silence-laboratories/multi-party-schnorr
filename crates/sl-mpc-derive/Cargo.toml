[package]
name = "sl-mpc-derive"
version = "0.1.1"
edition = "2021"
license-file = "../../LICENSE"
description = "MPC signing derivation: hash-to-curve, hard derive tweak, Ristretto VRF curve types"
repository = "https://github.com/silence-laboratories/multi-party-schnorr"
rust-version = "1.88"

[features]
default = []
eddsa = ["dep:curve25519-dalek", "dep:ed25519-dalek"]
vrf = ["eddsa"]
k256 = ["dep:k256"]

[dependencies]
crypto-bigint = { version = "0.5", default-features = false }
elliptic-curve = { version = "0.13", default-features = false, features = ["arithmetic"] }
ff = { version = "0.13.0", default-features = false }
hmac = { version = "0.12.1", default-features = false }
rand = { version = "0.8", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.3.1", default-features = false }
sha2 = { version = "0.10.7", default-features = false }
thiserror = { version = "2", default-features = false }
curve25519-dalek = { version = "~4.1.3", default-features = false, features = ["alloc", "digest", "group"], optional = true }
ed25519-dalek = { version = "2.1.0", default-features = false, features = ["alloc", "zeroize", "rand_core", "digest"], optional = true }
k256 = { version = "0.13.2", default-features = false, features = ["arithmetic"], optional = true }

[dev-dependencies]
rand = "0.8"
