[package]
name = "mlsag-wasm-ll"
version = "0.1.0-pre.1"
edition = "2021"
license-file = "../../LICENSE"
description = "WebAssembly bindings for threshold MLSAG keygen and signing"
repository = "https://github.com/silence-laboratories/multi-party-schnorr"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
ciborium = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }
curve25519-dalek = { version = "~4.1.3", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = { version = "0.3", default-features = false }
rand = "0.8"
serde = "1"
sl-mpc-mlsag = { path = "../../crates/sl-mpc-mlsag", version = "0.1.0-pre.1", features = ["serde"] }
wasm-bindgen = "0.2.100"

[dev-dependencies]
wasm-bindgen-test = "0.3"
